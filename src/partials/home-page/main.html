<div class="main__container container">
  <h2 class="visually-hidden">Searched movies</h2>
  <div class="search-filter">
    <ul class="search-btn-list">
      <li class="search-btn-item">
        <button type="button" class="button popular-btn" data-action="popular">TRENDING</button>
      </li>
      <li class="search-btn-item">
        <button type="button" class="button top-rated-btn" data-action="top rated">
          TOPRATED
        </button>
      </li>
      <li class="search-btn-item">
        <button type="button" class="button upcoming-btn" data-action="upcoming">
          UPCOMING
        </button>
      </li>
      <li class="search-btn-item genre-filter-item">
        <label class="visually-hidden" for="genre-filter">Filter by genre</label>
        <select class="genre-filter" id="genre-filter">
          <option value="">ALL GENRES</option>
        </select>
      </li>
      <li class="search-btn-item year-range-filter-item">
        <label class="visually-hidden" for="year-from">Release year from</label>
        <input class="year-filter" id="year-from" type="number" min="1870" placeholder="FROM" />
        <span class="year-filter-separator" aria-hidden="true">-</span>
        <label class="visually-hidden" for="year-to">Release year to</label>
        <input class="year-filter" id="year-to" type="number" min="1870" placeholder="TO" />
        <button class="button year-filter-button" type="button">APPLY</button>
      </li>
    </ul>
  </div>
<div class="gallery" id="abc"></div>
</div>
